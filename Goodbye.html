<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- 垃圾废物网站开源 https://github.com/director4168/director4168.github.io/blob/main/ -->
	<title>网站和您Goodbye</title>
	<!-- Material Icons -->
	<!-- 官网 https://material.io/resources/icons/ -->
	<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
	<!-- 字体库-思源宋体 -->
	<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200..900&display=swap" rel="stylesheet">

	<!-- 引入主配色CSS -->
	<link rel="stylesheet" href="./css/MainColorStyle_Default.css">
	<!-- 引入附加CSS样式 -->
	<link rel="stylesheet" href="./css/AdditionalStyles.css">

</head>

<body>
	<!-- 主要内容区域 -->
	<div class="main-content">
		<!-- 介绍 -->
		<div class="hero-section">


			<h1 class="hero-title">网站和您Goodbye</h1>
			<p class="hero-description">
				再见，项目暂时停止开发
			<p style="margin-top: 12px; font-size: 14px; color: var(--md-on-surface-variant); border: 1px solid var(--md-primary); border-radius: 16px; padding: 12px 16px;">
				<span class="material-icons" style="font-size: 14px; vertical-align: middle;">info</span>
				这个的网站暂时停止开发
			</p>
		</div>










		<!-- 返回卡片 -->
		<div class="card">
			<h2 class="card-title">百度</h2>
			<p class="hero-description"></p>
			*点击卡片跳转到百度
			</p>
			<div class="grid">




				<a class="list-item" href="javascript:void(0);" data-href="https://m.baidu.com/" data-title="转到百度搜索更好的" data-content="转到百度吧，我写的不好看，去百度上搜搜更好的看吧">
					<span class="material-icons list-icon">search</span>
					<div class="list-content">
						<div class="list-title">
							百度
						</div>
						<div class="list-subtitle">
							跳转到百度
						</div>
					</div>
					<span class="material-icons" style="color: var(--md-outline);">insert_link</span>
				</a>



			</div>
		</div>










		<!-- 页尾 -->
		<div class="footer">
			<p>
				Version: Goodbye
			</p>
				&copy; <span id="chinese-copyright-year">2025</span> director_Carter 保留所有权利。
			</p>
			<p>
				&copy; <span id="english-copyright-year">2025</span> director_Carter All Rights Reserved.
			</p>
		</div>










		<!-- 语言切换&主题切换按钮 -->	
		<div class="bottom-actions">
			<!-- 主题切换 -->
			<div class="btn" id="themeToggle">
				<span class="material-icons">dark_mode</span>
			</div>
		</div>









		<!-- MD3对话框 -->
		<div class="md3-dialog" id="md3Dialog">
			<div class="md3-dialog-content">
				<div class="md3-dialog-header" id="md3DialogHeader">
					标题
				</div>
				<div class="md3-dialog-body" id="md3DialogBody">
					内容
				</div>
				<div class="md3-dialog-actions">
					<button class="md3-button contained" id="md3DialogConfirm">确定</button>
				</div>
			</div>
		</div>


		<!-- 引入核心JS -->
		<script src="./js/CoreLogic.js"></script>
		<script src="./js/Protect.js"></script>
</body>

</html>
