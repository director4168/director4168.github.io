<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时聊天</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#f5f5f5;padding:20px}
.chat-box{max-width:500px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.chat-header{background:#2d81ff;color:#fff;padding:14px;text-align:center;font-weight:700}
.messages{height:400px;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.msg{padding:8px 12px;border-radius:16px;max-width:70%;word-break:break-word}
.me{align-self:flex-end;background:#2d81ff;color:#fff}
.other{align-self:flex-start;background:#eaeaea;color:#333}
.input-box{display:flex;padding:10px;border-top:1px solid #eee}
input{flex:1;padding:10px 14px;border:1px solid #ddd;border-radius:20px;outline:0}
button{margin-left:8px;padding:0 18px;background:#2d81ff;color:#fff;border:none;border-radius:20px;cursor:pointer}
</style>
</head>
<body>

<div class="chat-box">
  <div class="chat-header">实时聊天室</div>
  <div class="messages" id="msgList"></div>
  <div class="input-box">
    <input type="text" id="msgInput" placeholder="输入消息…">
    <button id="send">发送</button>
  </div>
</div>

<script>
const msgList = document.getElementById('msgList');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('send');
const myId = Math.random().toString(36).slice(2,6);

// 发送消息
function send() {
  const text = msgInput.value.trim();
  if (!text) return;

  const msg = {
    text,
    id: myId,
    time: Date.now()
  };

  // 存入本地存储，实现同浏览器多标签聊天
  const list = JSON.parse(localStorage.chatList || '[]');
  list.push(msg);
  localStorage.chatList = JSON.stringify(list);
  render();
  msgInput.value = '';
}

// 渲染消息
function render() {
  msgList.innerHTML = '';
  const list = JSON.parse(localStorage.chatList || '[]');
  list.forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg ' + (m.id === myId ? 'me' : 'other');
    div.textContent = m.text;
    msgList.appendChild(div);
  });
  msgList.scrollTop = msgList.scrollHeight;
}

sendBtn.onclick = send;
msgInput.onkeydown = e => e.key === 'Enter' && send();

// 实时监听
setInterval(render, 500);
</script>
</body>
</html>
