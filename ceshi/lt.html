<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>局域网实时聊天</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#f5f5f5;padding:20px}
.chat{max-width:500px;margin:0 auto;background:#fff;border-radius:12px;overflow:hidden}
.header{background:#2d81ff;color:#fff;padding:14px;text-align:center}
.msg-box{height:400px;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.msg{padding:8px 12px;border-radius:16px;max-width:75%}
.me{align-self:flex-end;background:#2d81ff;color:#fff}
.other{align-self:flex-start;background:#eaeaea}
.input{display:flex;padding:10px;border-top:1px solid #eee}
input{flex:1;padding:10px 14px;border:1px solid #ddd;border-radius:20px;outline:0}
button{margin-left:8px;padding:0 18px;background:#2d81ff;color:#fff;border:none;border-radius:20px;cursor:pointer}
</style>
</head>
<body>

<div class="chat">
  <div class="header">局域网聊天（同一WiFi可用）</div>
  <div class="msg-box" id="msgBox"></div>
  <div class="input">
    <input type="text" id="input" placeholder="输入消息">
    <button id="send">发送</button>
  </div>
</div>

<script>
const msgBox = document.getElementById('msgBox');
const input = document.getElementById('input');
const send = document.getElementById('send');

// 公共 PeerJS 中转服务器（免费、无需注册）
const peer = new Peer(null, {
  host: 'peerjs-server.herokuapp.com',
  port: 443,
  path: '/',
  secure: true
});

let conn = null;
const myId = Math.random().toString(36).slice(2,8);

peer.on('open', id => {
  console.log('我的ID:', id);
});

// 接收连接
peer.on('connection', c => {
  conn = c;
  conn.on('data', data => {
    addMsg(data, false);
  });
});

// 发送
function sendMsg() {
  const text = input.value.trim();
  if (!text || !conn) return;
  conn.send(text);
  addMsg(text, true);
  input.value = '';
}

// 显示消息
function addMsg(text, isMe) {
  const div = document.createElement('div');
  div.className = 'msg ' + (isMe ? 'me' : 'other');
  div.textContent = text;
  msgBox.appendChild(div);
  msgBox.scrollTop = msgBox.scrollHeight;
}

send.onclick = sendMsg;
input.onkeydown = e => e.key === 'Enter' && sendMsg();

// 手动连接对方
const peerId = prompt('输入对方的聊天ID：');
if (peerId) {
  conn = peer.connect(peerId);
  conn.on('open', () => console.log('连接成功'));
}

// 引入 PeerJS
const script = document.createElement('script');
script.src = 'https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js';
document.body.appendChild(script);
</script>
</body>
</html>
